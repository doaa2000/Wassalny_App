workflows:
  android-internal-testing:
    name: Android — Internal Testing
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Configure this keystore reference under
      # Codemagic > Team settings > Code signing identities > Android,
      # then link it here by its reference name.
      android_signing:
        -  Wassalny-rider
      groups:
        # Env var group holding GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (the
        # Google Play service account JSON), created under
        # Codemagic > Team settings > Environment variables.
        - google_play
        # Env var group holding MAPS_API_KEY, created under
        # Codemagic > Team settings > Environment variables.
        - google_maps
        # Env var group holding SUPABASE_URL and SUPABASE_ANON_KEY (the
        # same secrets from supabase.json, which is gitignored and only
        # exists locally), created under Codemagic > Team settings >
        # Environment variables.
        - app_secrets
      vars:
        PACKAGE_NAME: "eg.wassalny.rider"
      flutter: stable
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Write key.properties for release signing
        script: |
          cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Write Maps API key into local.properties
        script: |
          echo "MAPS_API_KEY=$MAPS_API_KEY" > "$CM_BUILD_DIR/android/local.properties"
      - name: Write dart-define file for Supabase config
        script: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_URL or SUPABASE_ANON_KEY is empty — add them to the app_secrets group in Codemagic > Team settings > Environment variables."
            exit 1
          fi
          cat > "$CM_BUILD_DIR/dart_define.json" <<EOF
          {
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY"
          }
          EOF
      - name: Build release App Bundle
        script: |
          flutter build appbundle --release \
            --build-number=$BUILD_NUMBER \
            --dart-define-from-file="$CM_BUILD_DIR/dart_define.json"
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - doaaabdeen9@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false