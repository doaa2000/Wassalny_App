workflows:
  android-internal-testing:
    name: Android — Internal Testing
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Configure this keystore reference under
      # Codemagic > Team settings > Code signing identities > Android,
      # then link it here by its reference name.
      android_signing:
        -  Wassalny-rider
      groups:
        # Env var group holding GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (the
        # Google Play service account JSON), created under
        # Codemagic > Team settings > Environment variables.
        - google_play
        # Env var group holding MAPS_API_KEY, SUPABASE_URL and
        # SUPABASE_ANON_KEY (the same secrets from android/local.properties
        # and supabase.json, which are gitignored and only exist locally),
        # created under Codemagic > Team settings > Environment variables.
        - app_secrets
      vars:
        PACKAGE_NAME: "eg.wassalny.rider"
      flutter: stable
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Write key.properties for release signing
        script: |
          cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Write local.properties for Google Maps API key
        script: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "ERROR: MAPS_API_KEY is empty — add it to the app_secrets group in Codemagic > Team settings > Environment variables."
            exit 1
          fi
          # Trim accidental leading/trailing whitespace or quotes from pasting
          # the value into the Codemagic UI, and sanity-check the shape of a
          # Google API key (AIza + 35 chars) without printing the key itself.
          TRIMMED_MAPS_API_KEY=$(echo "$MAPS_API_KEY" | tr -d '[:space:]"'"'"'')
          echo "MAPS_API_KEY: length=${#TRIMMED_MAPS_API_KEY} prefix=${TRIMMED_MAPS_API_KEY:0:4}"
          if ! echo "$TRIMMED_MAPS_API_KEY" | grep -qE '^AIza[0-9A-Za-z_-]{35}$'; then
            echo "WARNING: MAPS_API_KEY doesn't look like a well-formed Google API key (expected AIza + 35 chars). Check for a copy/paste mistake in Codemagic's Environment variables UI."
          fi
          cat >> "$CM_BUILD_DIR/android/local.properties" <<EOF
          MAPS_API_KEY=$TRIMMED_MAPS_API_KEY
          EOF
      - name: Write dart-define file for Supabase config
        script: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_URL or SUPABASE_ANON_KEY is empty — add them to the app_secrets group in Codemagic > Team settings > Environment variables."
            exit 1
          fi
          cat > "$CM_BUILD_DIR/dart_define.json" <<EOF
          {
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY"
          }
          EOF
      - name: Build release App Bundle
        script: |
          flutter build appbundle --release \
            --build-number=$BUILD_NUMBER \
            --dart-define-from-file="$CM_BUILD_DIR/dart_define.json"
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - doaaabdeen9@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
